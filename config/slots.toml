# Slot ↔ USB path map. Do not move dock cables after mapping.
#
# Remap helpers (on the mini PC):
#   sudo tools/dock_characterize.sh --quad   # StarTech 4-bay → SATA-1..4
#   sudo tools/dock_characterize.sh --dual   # Sabrent 2-bay → SATA-5/6
#   sudo tools/dock_characterize.sh          # NVMe / M.2 / SUITOK seats
# Override with DRIVESTATION_SLOTS=/path/to/slots.toml

# --- StarTech SDOCK4U313 (primary SATA) — not on hub yet -------------------
[slots.SATA-1]
id_path = "UNMAPPED-SATA-1"
bridge = "asmedia_sata"
hot_swap = true
shared_power_group = "STARTECH 4BAY"

[slots.SATA-2]
id_path = "UNMAPPED-SATA-2"
bridge = "asmedia_sata"
hot_swap = true
shared_power_group = "STARTECH 4BAY"

[slots.SATA-3]
id_path = "UNMAPPED-SATA-3"
bridge = "asmedia_sata"
hot_swap = true
shared_power_group = "STARTECH 4BAY"

[slots.SATA-4]
id_path = "UNMAPPED-SATA-4"
bridge = "asmedia_sata"
hot_swap = true
shared_power_group = "STARTECH 4BAY"

# --- Sabrent dual SATA (mapped 2026-07-29; path reconfirmed 2026-08-06) -----
[slots.SATA-5]
id_path = "pci-0000:00:14.0-usb-0:4.4.4.4:1.0-scsi-0:0:0:0"
bridge = "asmedia_sata"
hot_swap = false
shared_power_group = "SATA DOCK"

[slots.SATA-6]
id_path = "pci-0000:00:14.0-usb-0:4.4.4.4:1.0-scsi-0:0:0:1"
bridge = "asmedia_sata"
hot_swap = false
shared_power_group = "SATA DOCK"

# --- StarTech NVMe toasters (ASM2362 / sntasmedia) -------------------------
# Characterized 2026-08-06: 1USB3-NVME-DOCK (14b0:020d).
[slots.NVME-A1]
id_path = "pci-0000:00:14.0-usb-0:4.4.4.1:1.0-scsi-0:0:0:0"
bridge = "asm2362"
hot_swap = true

[slots.NVME-B1]
id_path = "pci-0000:00:14.0-usb-0:4.4.4.2:1.0-scsi-0:0:0:0"
bridge = "asm2362"
hot_swap = true

# --- SUITOK dual NVMe (WIPE ONLY — RTL9210) --------------------------------
# Remapped 2026-08-07 after USB tree recovery: only one RTL9210 is on the bus
# (port 8 branch, next to M2-1). C2/D1/D2 stay UNMAPPED until those docks
# enumerate again — then: sudo tools/dock_characterize.sh
[slots.NVME-C1]
id_path = "pci-0000:00:14.0-usb-0:8.4.2.1:1.0-scsi-0:0:0:0"
bridge = "rtl9210"
hot_swap = true

[slots.NVME-C2]
id_path = "UNMAPPED-NVME-C2"
bridge = "rtl9210"
hot_swap = true

[slots.NVME-D1]
id_path = "UNMAPPED-NVME-D1"
bridge = "rtl9210"
hot_swap = true

[slots.NVME-D2]
id_path = "UNMAPPED-NVME-D2"
bridge = "rtl9210"
hot_swap = true

# --- M.2 dual dock bay 1 (RTL9220) — mapped 2026-08-06 --------------------
[slots.M2-1]
id_path = "pci-0000:00:14.0-usb-0:8.4.4.3:1.0-scsi-0:0:0:0"
bridge = "rtl9220"
hot_swap = true
