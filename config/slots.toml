# Frozen Phase 0 slot map. Do not move USB cables without updating these paths.
# Re-run: sudo tools/dock_characterize.sh and --dual, then edit this file.
# Override path with DRIVESTATION_SLOTS=/path/to/slots.toml

[slots.SATA-1]
