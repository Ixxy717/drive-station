# Slot ↔ USB path map. Names match the physical docks on the bench.
#
#   NVME-A1 / B1  = StarTech single-bay NVMe toasters (grade)
#   SATA-1..4     = StarTech SDOCK4U313 4-bay SATA (replaces Sabrent dual)
#   M2-1          = M.2 dock
#   SUITOK-1..4   = SUITOK wipe-only NVMe
#
# Remap helpers (on the mini PC):
#   sudo tools/dock_characterize.sh          # guided (one bay at a time)
#   sudo tools/dock_characterize.sh --quad   # StarTech 4-bay → SATA-1..4
# Override with DRIVESTATION_SLOTS=/path/to/slots.toml

# --- StarTech NVMe toasters (14b0:020d / ASM2362) ---------------------------
[slots.NVME-A1]
id_path = "pci-0000:00:14.0-usb-0:4.4.4.1:1.0-scsi-0:0:0:0"
bridge = "asm2362"
hot_swap = true

[slots.NVME-B1]
id_path = "pci-0000:00:14.0-usb-0:4.4.4.2:1.0-scsi-0:0:0:0"
bridge = "asm2362"
hot_swap = true

# --- StarTech SDOCK4U313 4-bay SATA (hot-swap) ------------------------------
# Mapped 2026-08-07 --quad (size→bay: ~256/512/1000/2000 → SATA-1..4)
[slots.SATA-1]
id_path = "pci-0000:00:14.0-usb-0:8.4.4.4.3:1.0-scsi-0:0:0:0"
bridge = "asmedia_sata"
hot_swap = true
shared_power_group = "STARTECH SATA"

[slots.SATA-2]
id_path = "pci-0000:00:14.0-usb-0:8.4.4.4.4:1.0-scsi-0:0:0:0"
bridge = "asmedia_sata"
hot_swap = true
shared_power_group = "STARTECH SATA"

[slots.SATA-3]
id_path = "pci-0000:00:14.0-usb-0:8.4.4.4.2:1.0-scsi-0:0:0:0"
bridge = "asmedia_sata"
hot_swap = true
shared_power_group = "STARTECH SATA"

[slots.SATA-4]
id_path = "pci-0000:00:14.0-usb-0:8.4.4.4.1:1.0-scsi-0:0:0:0"
bridge = "asmedia_sata"
hot_swap = true
shared_power_group = "STARTECH SATA"

# --- M.2 dock (RTL9220DP) --------------------------------------------------
[slots.M2-1]
id_path = "pci-0000:00:14.0-usb-0:8.4.4.3:1.0-scsi-0:0:0:0"
bridge = "rtl9220"
hot_swap = true

# --- SUITOK wipe-only (2026-08-07 characterize) ----------------------------
# Dual A: 4.4.3.1 + 4.4.3.2 ; Dual B: 4.4.2.1 + 4.4.2.2
[slots.SUITOK-1]
id_path = "pci-0000:00:14.0-usb-0:4.4.3.1:1.0-scsi-0:0:0:0"
bridge = "rtl9210"
hot_swap = true

[slots.SUITOK-2]
id_path = "pci-0000:00:14.0-usb-0:4.4.3.2:1.0-scsi-0:0:0:0"
bridge = "rtl9210"
hot_swap = true

[slots.SUITOK-3]
id_path = "pci-0000:00:14.0-usb-0:4.4.2.1:1.0-scsi-0:0:0:0"
bridge = "rtl9210"
hot_swap = true

[slots.SUITOK-4]
id_path = "pci-0000:00:14.0-usb-0:4.4.2.2:1.0-scsi-0:0:0:0"
bridge = "rtl9210"
hot_swap = true
