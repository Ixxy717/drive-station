<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Station</title>
<style>
  /* Graphite console frame + light instrument cards.
     Square geometry. Fixed card footprints. Color = state only:
     green = verified wiped, amber = running, red = fault, blue = identifying.
     Empty slots are ghost outlines so occupied slots carry all the weight. */
  :root {
    --canvas: #34373d;
    --section: #3d4046;
    --hair-dk: #4c5057;
    --ghost: #61656d;
    --card: #f1f1ef;
    --card-line: #d9d9d5;
    --ink: #1b1d20;
    --muted: #75787f;
    --topbar: #232529;
    --ok: #178040;
    --work: #d19200;
    --alarm: #c03328;
    --active: #2f6fc4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body {
    background: var(--canvas); color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  .num { font-family: "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */
  #topbar {
    background: var(--topbar); color: #eceded;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 22px; height: 46px;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid #000;
  }
  #topbar .title { font-size: 13px; font-weight: 700; letter-spacing: 3.5px; }
  #topbar .right { display: flex; align-items: center; gap: 26px; }
  #counts { display: flex; gap: 20px; font-size: 12px; font-weight: 600; }
  #counts .c { display: flex; align-items: center; gap: 7px; color: #a6a9af; }
  #counts .n { color: #fff; font-weight: 700; }
  #counts .sq { width: 8px; height: 8px; display: inline-block; }
  .sq.READY    { background: #eceded; }
  .sq.CHECKING, .sq.DETECTED { background: var(--active); }
  .sq.WIPING, .sq.VERIFYING  { background: var(--work); }
  .sq.PASSED   { background: #1da04f; }
  .sq.FAILED, .sq.ERROR { background: #e04a3d; }
  .sq.EMPTY    { background: var(--ghost); }
  #clock { font-size: 13px; color: #a6a9af; letter-spacing: .5px; }

  /* ---------- dock sections ---------- */
  #groups {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; padding: 18px 22px;
  }
  @media (max-width: 1150px) { #groups { grid-template-columns: repeat(2, 1fr); } }
  .group { background: var(--section); border: 1px solid var(--hair-dk); padding: 14px; }
  .group h2 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    color: #cdd0d5; text-transform: uppercase;
    padding-bottom: 10px; margin-bottom: 14px;
    border-bottom: 1px solid var(--hair-dk);
  }
  .group h2 .cnt { color: #83878e; font-weight: 600; letter-spacing: .5px; }

  /* ---------- slot cards: fixed footprint, never shifts ---------- */
  .tile {
    display: flex; flex-direction: column;
    height: 282px; overflow: hidden;
  }
  .tile + .tile { margin-top: 14px; }
  .tile.solid { background: var(--card); border: 1px solid #101113; }
  .tile.ghost { background: transparent; border: 1px dashed var(--ghost); color: #8d9199; }

  .tilebar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px 9px;
  }
  .solid .tilebar { border-bottom: 1px solid var(--card-line); }
  .tilebar .id { font-size: 14px; font-weight: 800; letter-spacing: .8px; }
  .tilebar .iface {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    color: var(--muted); border: 1px solid var(--card-line);
    padding: 2px 7px; text-transform: uppercase;
  }

  .data { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 76px 1fr; align-items: baseline; }
  .row .k {
    font-size: 10.5px; font-weight: 600; letter-spacing: .8px;
    color: var(--muted); text-transform: uppercase;
  }
  .row .v { font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
  .row .v.model { font-weight: 700; }
  .row .v.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  .row .v.flags {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    overflow-wrap: normal; font-size: 12.5px;
  }
  .v.h-GOOD { color: var(--ok); font-weight: 700; }
  .v.h-WARNING { color: #96660a; font-weight: 700; }
  .v.h-FAIL { color: var(--alarm); font-weight: 700; }

  .nodevice {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
  }
  .solid .nodevice { color: var(--muted); }

  /* ---------- progress ---------- */
  .prog { padding: 2px 14px 12px; margin-top: auto; }
  .prog .lbl {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10.5px; font-weight: 600; letter-spacing: .8px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 5px;
  }
  .prog .pct { font-size: 21px; font-weight: 700; color: var(--ink); }
  .prog .bar { height: 6px; background: #dddddad9; }
  .prog .bar > div { height: 100%; background: var(--work); transition: width .4s linear; }

  /* ---------- status band ---------- */
  .foot { margin-top: auto; padding: 9px 14px 10px; }
  .prog + .foot { margin-top: 0; }
  .foot .word { font-size: 15px; font-weight: 800; letter-spacing: 2px; }
  .foot .note { font-size: 12px; font-weight: 500; margin-top: 2px; }
  .ghost .foot { color: #8d9199; padding-bottom: 12px; }
  .solid .foot { border-top: 1px solid var(--card-line); }
  .foot.READY { background: #e4e4e1; }
  .foot.DETECTED, .foot.CHECKING { background: var(--active); color: #fff; border-top: none; }
  .foot.CHECKING .word { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .foot.WIPING, .foot.VERIFYING { background: var(--work); color: #141414; border-top: none; }
  .foot.PASSED { background: var(--ok); color: #fff; border-top: none; }
  .foot.FAILED, .foot.ERROR { background: var(--alarm); color: #fff; border-top: none; }

  /* ---------- operator action ---------- */
  .ask { padding: 10px 14px 13px; border-top: 1px solid var(--card-line); margin-top: auto; }
  .ask .q {
    font-size: 10.5px; font-weight: 600; letter-spacing: .8px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
  }
  .buttons { display: flex; gap: 9px; }
  button.act {
    flex: 1; height: 46px; font-size: 14px; font-weight: 700;
    letter-spacing: 2px; cursor: pointer; font-family: inherit;
    border: 1px solid transparent;
  }
  .yes { background: var(--ok); color: #fff; }
  .yes:active { background: #0f5e2c; }
  .no { background: transparent; color: var(--ink); border-color: #b9b9b4; }
  .no:active { background: #e4e4e1; }

  /* ---------- simulator ---------- */
  #simpanel {
    display: none; margin: 0 22px 18px;
    background: var(--section); border: 1px solid var(--hair-dk);
    padding: 14px; color: #cdd0d5;
  }
  #simpanel h2 {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase;
    padding-bottom: 10px; margin-bottom: 12px;
    border-bottom: 1px solid var(--hair-dk);
  }
  #simrows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 26px; }
  #simpanel .srow { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  #simpanel b { width: 62px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  #simpanel select, #simpanel button {
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px;
    border: 1px solid var(--hair-dk); background: #2c2e33;
    color: #cdd0d5; padding: 4px 9px; cursor: pointer;
  }
  #simpanel button:active { background: #3d4046; }
</style>
</head>
<body>
  <div id="topbar">
    <span class="title">DRIVE STATION</span>
    <div class="right">
      <div id="counts"></div>
      <span id="clock" class="num"></span>
    </div>
  </div>
  <div id="groups"></div>
  <div id="simpanel">
    <h2>Simulation control — dev build only</h2>
    <div id="simrows"></div>
  </div>

<script>
const PRESETS = ["healthy_nvme","worn_nvme","failing_nvme","healthy_ssd",
  "smart_fail_ssd","healthy_hdd","warning_hdd","failing_hdd",
  "yank_mid_wipe","wipe_rejected","verify_fail","wont_identify"];

const TYPE_LABEL = { NVME: "NVMe", SATA_SSD: "SATA SSD", SATA_HDD: "SATA HDD" };
const STATUS_ORDER = ["READY","CHECKING","WIPING","VERIFYING","PASSED","FAILED","ERROR","EMPTY"];

async function post(url, body) {
  await fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : null});
}

function row(k, v, cls = "") {
  return `<div class="row"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`;
}

function tileHTML(s) {
  const d = s.drive, h = s.health;

  if (s.status === "EMPTY") {
    return `<div class="tile ghost">
        <div class="tilebar"><span class="id">${s.slot_id}</span></div>
        <div class="nodevice">NO DEVICE</div>
        <div class="foot"><span class="word">EMPTY</span></div>
      </div>`;
  }

  let body = "";
  if (d) {
    body = `<div class="data">`;
    body += row("Model", `${d.manufacturer} ${d.model}`, "model");
    body += row("Serial", d.serial, "mono");
    body += row("Capacity", d.capacity);
    if (h) {
      const pct = h.percent === null ? "" : `${h.percent}% `;
      body += row("Health", `${pct}${h.verdict}`, `h-${h.verdict}`);
      // Flags are hidden while a wipe runs: the progress block needs the
      // space, and the warnings were already shown at the READY decision.
      const busy = s.status === "WIPING" || s.status === "VERIFYING";
      if (h.warnings.length && !busy) body += row("Flags", h.warnings.join(" · "), "flags");
    }
    if (s.wipe_method && s.status !== "READY") {
      body += row("Method", s.wipe_method.replaceAll("_", " "), "mono");
    }
    body += `</div>`;
  } else if (s.status === "DETECTED" || s.status === "CHECKING") {
    body = `<div class="nodevice">IDENTIFYING</div>`;
  } else {
    body = `<div class="nodevice">NO DEVICE DATA</div>`;
  }

  if (s.status === "WIPING" || s.status === "VERIFYING") {
    const pct = Math.round(s.progress * 100);
    body += `<div class="prog">
        <div class="lbl"><span>${s.status === "WIPING" ? "Wipe pass" : "Read-back verify"}</span>
        <span class="pct num">${pct}%</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </div>`;
  }

  let ask = "";
  if (s.status === "READY" && s.awaiting_confirm) {
    ask = `<div class="ask"><div class="q">Secure wipe this drive?</div>
      <div class="buttons">
        <button class="act yes" onclick="post('/api/slots/${s.slot_id}/wipe')">WIPE</button>
        <button class="act no" onclick="post('/api/slots/${s.slot_id}/decline')">SKIP</button>
      </div></div>`;
  }

  let foot = "";
  if (!ask) {
    foot = `<div class="foot ${s.status}"><span class="word">${s.status}</span>` +
      (s.message ? `<div class="note">${s.message}</div>` : "") + `</div>`;
  }

  return `<div class="tile solid">
      <div class="tilebar"><span class="id">${s.slot_id}</span>
        ${d ? `<span class="iface">${TYPE_LABEL[d.drive_type] ?? ""}</span>` : ""}</div>
      ${body}${ask}${foot}
    </div>`;
}

let simBuilt = false;
function buildSim(slots) {
  document.getElementById("simrows").innerHTML = slots.map(s => `
    <div class="srow">
      <b>${s.slot_id}</b>
      <select id="preset-${s.slot_id}">
        ${PRESETS.map(p => `<option>${p}</option>`).join("")}
      </select>
      <button onclick="post('/api/sim/insert',{slot:'${s.slot_id}',preset:document.getElementById('preset-${s.slot_id}').value})">insert</button>
      <button onclick="post('/api/sim/remove',{slot:'${s.slot_id}'})">yank</button>
    </div>`).join("");
  document.getElementById("simpanel").style.display = "block";
  simBuilt = true;
}

function renderCounts(slots) {
  const c = {};
  for (const s of slots) c[s.status] = (c[s.status] ?? 0) + 1;
  document.getElementById("counts").innerHTML = STATUS_ORDER
    .filter(st => c[st])
    .map(st => `<span class="c"><span class="sq ${st}"></span>${st} <span class="n num">${c[st]}</span></span>`)
    .join("");
}

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
}
setInterval(tick, 1000); tick();

async function refresh() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    const groups = {};
    for (const s of data.slots) (groups[s.group] ??= []).push(s);
    document.getElementById("groups").innerHTML =
      Object.entries(groups).map(([name, slots]) =>
        `<div class="group"><h2><span>${name}</span><span class="cnt">${slots.length} SLOTS</span></h2>
         ${slots.map(tileHTML).join("")}</div>`
      ).join("");
    renderCounts(data.slots);
    if (data.sim_mode && !simBuilt) buildSim(data.slots);
  } catch (e) { /* server restarting; keep polling */ }
}
refresh();
setInterval(refresh, 700);
</script>
</body>
</html>
