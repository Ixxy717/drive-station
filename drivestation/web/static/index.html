<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Station</title>
<style>
  /* Theme: instrumentation gray. One background, one text color.
     Accent color appears ONLY on status strips, health verdicts,
     progress, and the two action buttons. No radii, no shadows. */
  :root {
    --bg: #97999c;        /* page */
    --panel: #aeb0b3;     /* tile body */
    --panel-alt: #c2c4c6; /* zebra rows / secondary surfaces */
    --line: #3a3c3f;      /* all borders */
    --ink: #141414;       /* primary text */
    --ink-dim: #45474a;   /* labels, secondary text */
    --chrome: #34363a;    /* header strips */
    --chrome-ink: #e6e6e6;
    --st-neutral: #7e8083;
    --st-active: #14589f; /* detection / checking */
    --st-ok: #0d7a2f;     /* ready / passed */
    --st-work: #c68a00;   /* wiping / verifying */
    --st-alarm: #ac221b;  /* failed / error / health fail */
    --st-warn: #8a5f00;   /* health warning text */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }

  /* ---- top bar ---- */
  #topbar {
    background: var(--chrome); color: var(--chrome-ink);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; font-size: 13px;
  }
  #topbar .title { font-weight: 800; letter-spacing: 1px; font-size: 15px; }
  #topbar .counts span { margin-left: 14px; font-weight: 700; }
  #topbar .counts .n { font-family: Consolas, monospace; }

  /* ---- slot grid ---- */
  .groups {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; padding: 12px;
  }
  @media (max-width: 1100px) { .groups { grid-template-columns: repeat(2, 1fr); } }
  .group h2 {
    font-size: 12px; font-weight: 700; color: var(--ink-dim);
    text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px;
  }
  .tile {
    background: var(--panel); border: 1px solid var(--line);
    margin-bottom: 12px; display: flex; flex-direction: column;
    min-height: 210px;
  }
  .tilehead {
    background: var(--chrome); color: var(--chrome-ink);
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 10px; font-size: 14px; font-weight: 800;
    border-bottom: 1px solid var(--line);
  }
  .tilehead .iface { font-size: 11px; font-weight: 700; opacity: .8; }

  .rows { padding: 6px 0; }
  .row {
    display: grid; grid-template-columns: 74px 1fr;
    padding: 3px 10px; font-size: 13px; line-height: 1.35;
  }
  .row:nth-child(even) { background: var(--panel-alt); }
  .row .k {
    color: var(--ink-dim); font-size: 11px; font-weight: 700;
    text-transform: uppercase; align-self: baseline; padding-top: 1px;
  }
  .row .v { font-weight: 600; overflow-wrap: anywhere; }
  .row .v.mono { font-family: Consolas, monospace; font-weight: 400; }
  .v.h-GOOD { color: var(--st-ok); font-weight: 800; }
  .v.h-WARNING { color: var(--st-warn); font-weight: 800; }
  .v.h-FAIL { color: var(--st-alarm); font-weight: 800; }

  .nodevice {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); font-size: 13px; font-weight: 700;
    letter-spacing: 2px;
  }

  /* ---- progress ---- */
  .prog { padding: 4px 10px 8px; }
  .prog .pctline {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; font-weight: 700; color: var(--ink-dim);
  }
  .prog .pct { font-size: 26px; font-weight: 800; color: var(--ink); font-family: Consolas, monospace; }
  .prog .bar { height: 14px; border: 1px solid var(--line); background: var(--panel-alt); }
  .prog .bar > div { height: 100%; background: var(--st-work); transition: width .4s linear; }

  /* ---- status strip (the only large color surface) ---- */
  .strip {
    margin-top: auto; border-top: 1px solid var(--line);
    padding: 7px 10px; color: #fff;
  }
  .strip .word { font-size: 21px; font-weight: 900; letter-spacing: 1px; }
  .strip .note { font-size: 12px; font-weight: 600; margin-top: 1px; }
  .strip.EMPTY { background: var(--st-neutral); }
  .strip.DETECTED, .strip.CHECKING { background: var(--st-active); }
  .strip.CHECKING .word { animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  /* READY is a decision point, not a success — keep it neutral so green
     strictly means "wiped and verified" and never appears on a bad drive. */
  .strip.READY { background: var(--panel-alt); color: var(--ink); }
  .strip.PASSED { background: var(--st-ok); }
  .strip.WIPING, .strip.VERIFYING { background: var(--st-work); color: var(--ink); }
  .strip.FAILED, .strip.ERROR { background: var(--st-alarm); }

  /* ---- operator action ---- */
  .ask {
    padding: 8px 10px; border-top: 1px solid var(--line);
    background: var(--panel-alt);
  }
  .ask .q { font-size: 13px; font-weight: 800; margin-bottom: 6px; }
  .buttons { display: flex; gap: 8px; }
  button.act {
    flex: 1; height: 52px; font-size: 20px; font-weight: 900;
    border: 1px solid var(--line); cursor: pointer; font-family: inherit;
  }
  .yes { background: var(--st-ok); color: #fff; }
  .yes:active { background: #085c21; }
  .no { background: var(--panel); color: var(--ink); }
  .no:active { background: #98999c; }

  /* ---- simulator panel ---- */
  #simpanel {
    margin: 0 12px 12px; border: 1px dashed var(--line);
    padding: 8px 10px; font-family: Consolas, monospace; font-size: 12px;
    color: var(--ink-dim); display: none;
  }
  #simpanel .row2 { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  #simpanel b { width: 66px; color: var(--ink); }
  #simpanel select, #simpanel button {
    font-family: Consolas, monospace; font-size: 12px;
    border: 1px solid var(--line); background: var(--panel-alt);
    color: var(--ink); padding: 2px 8px; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="topbar">
    <span class="title">DRIVE STATION</span>
    <span class="counts" id="counts"></span>
  </div>
  <div class="groups" id="groups"></div>
  <div id="simpanel">
    SIMULATION CONTROL — DEV BUILD ONLY
    <div id="simrows"></div>
  </div>

<script>
const PRESETS = ["healthy_nvme","worn_nvme","failing_nvme","healthy_ssd",
  "smart_fail_ssd","healthy_hdd","warning_hdd","failing_hdd",
  "yank_mid_wipe","wipe_rejected","verify_fail","wont_identify"];

const TYPE_LABEL = { NVME: "NVMe", SATA_SSD: "SATA SSD", SATA_HDD: "SATA HDD" };
const STATUS_ORDER = ["EMPTY","CHECKING","READY","WIPING","VERIFYING",
                      "PASSED","FAILED","ERROR"];

async function post(url, body) {
  await fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : null});
}

function row(k, v, cls = "") {
  return `<div class="row"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`;
}

function tileHTML(s) {
  const d = s.drive, h = s.health;
  let body = "";

  if (!d && s.status === "EMPTY") {
    body = `<div class="nodevice">NO DEVICE</div>`;
  } else if (d) {
    body = `<div class="rows">`;
    body += row("Model", `${d.manufacturer} ${d.model}`);
    body += row("S/N", d.serial, "mono");
    body += row("Capacity", `${d.capacity} · ${TYPE_LABEL[d.drive_type] ?? d.drive_type}`);
    if (h) {
      const pct = h.percent === null ? "" : `${h.percent}% `;
      body += row("Health", `${pct}${h.verdict}`, `h-${h.verdict}`);
      if (h.warnings.length) body += row("Flags", h.warnings.join(" · "));
    }
    if (s.wipe_method && s.status !== "READY") {
      body += row("Method", s.wipe_method.replaceAll("_", " "), "mono");
    }
    body += `</div>`;
  } else if (s.status === "DETECTED" || s.status === "CHECKING") {
    body = `<div class="nodevice">IDENTIFYING…</div>`;
  } else {
    body = `<div class="nodevice">NO DEVICE DATA</div>`;
  }

  if (s.status === "WIPING" || s.status === "VERIFYING") {
    const pct = Math.round(s.progress * 100);
    body += `<div class="prog">
        <div class="pctline"><span>${s.status === "WIPING" ? "WIPE PASS" : "READ-BACK VERIFY"}</span>
        <span class="pct">${pct}%</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </div>`;
  }

  let strip = `<div class="strip ${s.status}"><span class="word">${s.status}</span>`;
  if (s.message) strip += `<div class="note">${s.message}</div>`;
  strip += `</div>`;

  let ask = "";
  if (s.status === "READY" && s.awaiting_confirm) {
    ask = `<div class="ask"><div class="q">SECURE WIPE THIS DRIVE?</div>
      <div class="buttons">
        <button class="act yes" onclick="post('/api/slots/${s.slot_id}/wipe')">WIPE</button>
        <button class="act no" onclick="post('/api/slots/${s.slot_id}/decline')">SKIP</button>
      </div></div>`;
  }

  return `<div class="tile">
      <div class="tilehead"><span>${s.slot_id}</span>
        <span class="iface">${d ? (TYPE_LABEL[d.drive_type] ?? "") : ""}</span></div>
      ${body}${strip}${ask}
    </div>`;
}

let simBuilt = false;
function buildSim(slots) {
  document.getElementById("simrows").innerHTML = slots.map(s => `
    <div class="row2">
      <b>${s.slot_id}</b>
      <select id="preset-${s.slot_id}">
        ${PRESETS.map(p => `<option>${p}</option>`).join("")}
      </select>
      <button onclick="post('/api/sim/insert',{slot:'${s.slot_id}',preset:document.getElementById('preset-${s.slot_id}').value})">insert</button>
      <button onclick="post('/api/sim/remove',{slot:'${s.slot_id}'})">remove / yank</button>
    </div>`).join("");
  document.getElementById("simpanel").style.display = "block";
  simBuilt = true;
}

function renderCounts(slots) {
  const c = {};
  for (const s of slots) c[s.status] = (c[s.status] ?? 0) + 1;
  document.getElementById("counts").innerHTML = STATUS_ORDER
    .filter(st => c[st])
    .map(st => `<span>${st} <span class="n">${c[st]}</span></span>`)
    .join("");
}

async function refresh() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    const groups = {};
    for (const s of data.slots) (groups[s.group] ??= []).push(s);
    document.getElementById("groups").innerHTML =
      Object.entries(groups).map(([name, slots]) =>
        `<div class="group"><h2>${name}</h2>${slots.map(tileHTML).join("")}</div>`
      ).join("");
    renderCounts(data.slots);
    if (data.sim_mode && !simBuilt) buildSim(data.slots);
  } catch (e) { /* server restarting; keep polling */ }
}
refresh();
setInterval(refresh, 700);
</script>
</body>
</html>
