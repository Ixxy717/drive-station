<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Station</title>
<style>
  /* Modern industrial console. Mid-tone canvas, light instrument cards,
     hairline separation, typographic hierarchy. Color appears only as
     state: green=verified wiped, amber=operation running, red=fault,
     blue=identifying, none=idle. Square geometry throughout. */
  :root {
    --canvas: #aaadb1;
    --section: #b9bcbf;
    --card: #e9eaeb;
    --card-dim: #dcdedf;
    --hair: #8f9296;
    --hair-soft: #c9cbcd;
    --ink: #1d1f21;
    --muted: #63666b;
    --topbar: #26282b;
    --ok: #177d3b;
    --work: #cc9200;
    --alarm: #b02a21;
    --active: #2a63a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body {
    background: var(--canvas); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }

  /* ---------- top bar ---------- */
  #topbar {
    background: var(--topbar); color: #e8e9ea;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; height: 42px;
    position: sticky; top: 0; z-index: 10;
  }
  #topbar .title { font-size: 13px; font-weight: 800; letter-spacing: 3px; }
  #counts { display: flex; gap: 18px; font-size: 12px; font-weight: 600; }
  #counts .c { display: flex; align-items: center; gap: 6px; color: #c3c5c8; }
  #counts .n { color: #fff; font-weight: 800; font-family: Consolas, monospace; }
  #counts .sq { width: 9px; height: 9px; display: inline-block; }
  .sq.READY    { background: #eceded; }
  .sq.CHECKING, .sq.DETECTED { background: var(--active); }
  .sq.WIPING, .sq.VERIFYING  { background: var(--work); }
  .sq.PASSED   { background: var(--ok); }
  .sq.FAILED, .sq.ERROR { background: var(--alarm); }
  .sq.EMPTY    { background: #55585c; }

  /* ---------- dock sections ---------- */
  #groups {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 18px; padding: 18px 20px;
  }
  @media (max-width: 1150px) { #groups { grid-template-columns: repeat(2, 1fr); } }
  .group {
    background: var(--section); border: 1px solid var(--hair);
    padding: 12px;
  }
  .group h2 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    color: #3f4246; text-transform: uppercase;
    padding-bottom: 9px; margin-bottom: 12px;
    border-bottom: 1px solid var(--hair);
  }
  .group h2 .cnt { color: var(--muted); font-weight: 600; letter-spacing: 0; }

  /* ---------- slot cards ---------- */
  /* Fixed footprint: a slot card never changes size, so no state change can
     shift the layout. Every slot is bound to a permanent screen position. */
  .tile {
    background: var(--card); border: 1px solid var(--hair);
    display: flex; flex-direction: column;
    height: 272px; overflow: hidden;
  }
  .tile + .tile { margin-top: 12px; }
  .tilebar {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 14px 8px;
    border-bottom: 1px solid var(--hair-soft);
  }
  .tilebar .id { font-size: 13px; font-weight: 800; letter-spacing: 1px; }
  .tilebar .iface {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
  }

  .data { padding: 11px 14px; display: flex; flex-direction: column; gap: 7px; }
  .row { display: grid; grid-template-columns: 78px 1fr; align-items: baseline; }
  .row .k {
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
    color: var(--muted); text-transform: uppercase;
  }
  .row .v { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
  /* Flags stay on one line (full detail lives in the job log) so row count,
     and therefore card layout, is deterministic. */
  .row .v.flags {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    overflow-wrap: normal;
  }
  .row .v.model { font-size: 14px; font-weight: 650; }
  .row .v.mono { font-family: Consolas, monospace; font-size: 12.5px; }
  .v.h-GOOD { color: var(--ok); font-weight: 750; }
  .v.h-WARNING { color: #8a5f00; font-weight: 750; }
  .v.h-FAIL { color: var(--alarm); font-weight: 750; }

  .nodevice {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #85888c; font-size: 11px; font-weight: 700; letter-spacing: 2.5px;
  }

  /* ---------- progress ---------- */
  .prog { padding: 2px 14px 12px; margin-top: auto; }
  .prog .lbl {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 4px;
  }
  .prog .pct { font-family: Consolas, monospace; font-size: 20px; font-weight: 700; color: var(--ink); }
  .prog .bar { height: 8px; background: #c6c8ca; }
  .prog .bar > div { height: 100%; background: var(--work); transition: width .4s linear; }

  /* ---------- status band: the single color statement per card ---------- */
  .foot { margin-top: auto; padding: 8px 14px 9px; border-top: 1px solid var(--hair-soft); }
  .prog + .foot, .ask ~ .foot { margin-top: 0; }
  .foot .word { font-size: 16px; font-weight: 800; letter-spacing: 1.5px; }
  .foot .note { font-size: 12px; font-weight: 500; margin-top: 1px; }
  .foot.EMPTY { color: #85888c; }
  .foot.READY { color: var(--ink); background: var(--card-dim); }
  .foot.DETECTED, .foot.CHECKING { background: var(--active); color: #fff; border-top-color: var(--active); }
  .foot.CHECKING .word { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .foot.WIPING, .foot.VERIFYING { background: var(--work); color: var(--ink); border-top-color: var(--work); }
  .foot.PASSED { background: var(--ok); color: #fff; border-top-color: var(--ok); }
  .foot.FAILED, .foot.ERROR { background: var(--alarm); color: #fff; border-top-color: var(--alarm); }

  /* ---------- operator action ---------- */
  .ask { padding: 10px 14px 12px; border-top: 1px solid var(--hair-soft); margin-top: auto; }
  .ask .q {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
  }
  .buttons { display: flex; gap: 8px; }
  button.act {
    flex: 1; height: 46px; font-size: 15px; font-weight: 700;
    letter-spacing: 1.5px; cursor: pointer; font-family: inherit;
    border: 1px solid transparent;
  }
  .yes { background: var(--ok); color: #fff; }
  .yes:active { background: #0f5e2b; }
  .no { background: transparent; color: var(--ink); border-color: var(--hair); }
  .no:active { background: var(--card-dim); }

  /* ---------- simulator ---------- */
  #simpanel {
    display: none; margin: 0 20px 18px;
    background: var(--section); border: 1px solid var(--hair);
    padding: 12px;
  }
  #simpanel h2 {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    color: #3f4246; text-transform: uppercase;
    padding-bottom: 9px; margin-bottom: 10px;
    border-bottom: 1px solid var(--hair);
  }
  #simrows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 24px; }
  #simpanel .srow { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  #simpanel b { width: 60px; font-family: Consolas, monospace; font-size: 12px; }
  #simpanel select, #simpanel button {
    font-family: Consolas, monospace; font-size: 11.5px;
    border: 1px solid var(--hair); background: var(--card);
    color: var(--ink); padding: 3px 8px; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="topbar">
    <span class="title">DRIVE STATION</span>
    <div id="counts"></div>
  </div>
  <div id="groups"></div>
  <div id="simpanel">
    <h2>Simulation control — dev build only</h2>
    <div id="simrows"></div>
  </div>

<script>
const PRESETS = ["healthy_nvme","worn_nvme","failing_nvme","healthy_ssd",
  "smart_fail_ssd","healthy_hdd","warning_hdd","failing_hdd",
  "yank_mid_wipe","wipe_rejected","verify_fail","wont_identify"];

const TYPE_LABEL = { NVME: "NVMe", SATA_SSD: "SATA SSD", SATA_HDD: "SATA HDD" };
const STATUS_ORDER = ["READY","CHECKING","WIPING","VERIFYING","PASSED","FAILED","ERROR","EMPTY"];

async function post(url, body) {
  await fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : null});
}

function row(k, v, cls = "") {
  return `<div class="row"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`;
}

function tileHTML(s) {
  const d = s.drive, h = s.health;
  let body = "";

  if (!d && s.status === "EMPTY") {
    body = `<div class="nodevice">NO DEVICE</div>`;
  } else if (d) {
    body = `<div class="data">`;
    body += row("Model", `${d.manufacturer} ${d.model}`, "model");
    body += row("Serial", d.serial, "mono");
    body += row("Capacity", d.capacity);
    if (h) {
      const pct = h.percent === null ? "" : `${h.percent}% `;
      body += row("Health", `${pct}${h.verdict}`, `h-${h.verdict}`);
      if (h.warnings.length) body += row("Flags", h.warnings.join(" · "), "flags");
    }
    if (s.wipe_method && s.status !== "READY") {
      body += row("Method", s.wipe_method.replaceAll("_", " "), "mono");
    }
    body += `</div>`;
  } else if (s.status === "DETECTED" || s.status === "CHECKING") {
    body = `<div class="nodevice">IDENTIFYING</div>`;
  } else {
    body = `<div class="nodevice">NO DEVICE DATA</div>`;
  }

  if (s.status === "WIPING" || s.status === "VERIFYING") {
    const pct = Math.round(s.progress * 100);
    body += `<div class="prog">
        <div class="lbl"><span>${s.status === "WIPING" ? "Wipe pass" : "Read-back verify"}</span>
        <span class="pct">${pct}%</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </div>`;
  }

  let ask = "";
  if (s.status === "READY" && s.awaiting_confirm) {
    ask = `<div class="ask"><div class="q">Secure wipe this drive?</div>
      <div class="buttons">
        <button class="act yes" onclick="post('/api/slots/${s.slot_id}/wipe')">WIPE</button>
        <button class="act no" onclick="post('/api/slots/${s.slot_id}/decline')">SKIP</button>
      </div></div>`;
  }

  let foot = "";
  if (!ask) {
    foot = `<div class="foot ${s.status}"><span class="word">${s.status}</span>` +
      (s.message ? `<div class="note">${s.message}</div>` : "") + `</div>`;
  }

  return `<div class="tile">
      <div class="tilebar"><span class="id">${s.slot_id}</span>
        <span class="iface">${d ? (TYPE_LABEL[d.drive_type] ?? "") : ""}</span></div>
      ${body}${ask}${foot}
    </div>`;
}

let simBuilt = false;
function buildSim(slots) {
  document.getElementById("simrows").innerHTML = slots.map(s => `
    <div class="srow">
      <b>${s.slot_id}</b>
      <select id="preset-${s.slot_id}">
        ${PRESETS.map(p => `<option>${p}</option>`).join("")}
      </select>
      <button onclick="post('/api/sim/insert',{slot:'${s.slot_id}',preset:document.getElementById('preset-${s.slot_id}').value})">insert</button>
      <button onclick="post('/api/sim/remove',{slot:'${s.slot_id}'})">yank</button>
    </div>`).join("");
  document.getElementById("simpanel").style.display = "block";
  simBuilt = true;
}

function renderCounts(slots) {
  const c = {};
  for (const s of slots) c[s.status] = (c[s.status] ?? 0) + 1;
  document.getElementById("counts").innerHTML = STATUS_ORDER
    .filter(st => c[st])
    .map(st => `<span class="c"><span class="sq ${st}"></span>${st} <span class="n">${c[st]}</span></span>`)
    .join("");
}

async function refresh() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    const groups = {};
    for (const s of data.slots) (groups[s.group] ??= []).push(s);
    document.getElementById("groups").innerHTML =
      Object.entries(groups).map(([name, slots]) =>
        `<div class="group"><h2><span>${name}</span><span class="cnt">${slots.length} SLOTS</span></h2>
         ${slots.map(tileHTML).join("")}</div>`
      ).join("");
    renderCounts(data.slots);
    if (data.sim_mode && !simBuilt) buildSim(data.slots);
  } catch (e) { /* server restarting; keep polling */ }
}
refresh();
setInterval(refresh, 700);
</script>
</body>
</html>
