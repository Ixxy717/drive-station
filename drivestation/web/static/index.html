<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Station</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #141414; color: #ddd;
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 20px; user-select: none;
  }
  .groups {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  @media (max-width: 1100px) { .groups { grid-template-columns: repeat(2, 1fr); } }
  .group h2 {
    font-size: 14px; font-weight: 600; color: #777;
    margin-bottom: 10px; text-transform: uppercase;
  }
  .tile {
    border-radius: 6px; padding: 16px; margin-bottom: 16px;
    min-height: 190px; display: flex; flex-direction: column; gap: 4px;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .slot { font-size: 15px; font-weight: 800; }
  .type { font-size: 12px; font-weight: 600; opacity: .65; }
  .model { font-size: 18px; font-weight: 600; line-height: 1.25; }
  .cap { font-size: 14px; opacity: .75; }
  .health { font-size: 16px; font-weight: 800; margin-top: 6px; }
  .warn { font-size: 13px; font-weight: 600; opacity: .9; }
  .status { font-size: 32px; font-weight: 900; margin-top: auto; line-height: 1.1; }
  .msg { font-size: 14px; font-weight: 600; margin-top: 2px; }

  /* State = whole-tile color. Readable from across the bench. */
  .tile.EMPTY { background: #1d1d1d; color: #4a4a4a; }
  .tile.EMPTY .status { margin: auto; font-size: 24px; letter-spacing: 1px; }
  .tile.EMPTY .slot { color: #5f5f5f; }

  .tile.DETECTED, .tile.CHECKING { background: #12509e; color: #fff; }
  .tile.DETECTED .status, .tile.CHECKING .status { animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  .tile.READY { background: #f1efe9; color: #151515; }
  .tile.READY .health.GOOD { color: #156e2d; }
  .tile.READY .health.WARNING { color: #8f5a00; }
  .tile.READY .health.FAIL { color: #a91d15; }
  .tile.READY .warn { color: #444; }

  .tile.WIPING, .tile.VERIFYING { background: #dd9e00; color: #161616; }
  .pct { font-size: 58px; font-weight: 900; line-height: 1; margin-top: 10px; }
  .bar { height: 12px; background: rgba(0,0,0,.25); margin-top: 8px; }
  .bar > div { height: 100%; background: #161616; transition: width .4s linear; }

  .tile.PASSED { background: #1c7c38; color: #fff; }
  .tile.FAILED, .tile.ERROR { background: #ab211a; color: #fff; }

  .ask { font-size: 15px; font-weight: 800; margin-top: 10px; }
  .buttons { display: flex; gap: 10px; margin-top: 8px; }
  button {
    flex: 1; height: 56px; font-size: 22px; font-weight: 900;
    border: none; border-radius: 4px; cursor: pointer;
    font-family: inherit;
  }
  .yes { background: #156e2d; color: #fff; }
  .yes:active { background: #0e5220; }
  .no { background: #c9c5bb; color: #222; }
  .no:active { background: #b3afa5; }

  #simpanel {
    margin-top: 26px; padding-top: 12px; border-top: 1px solid #2a2a2a;
    font-family: Consolas, monospace; font-size: 12px; color: #666;
  }
  #simpanel .row { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
  #simpanel b { width: 64px; color: #888; }
  #simpanel select, #simpanel button {
    all: revert; font-family: Consolas, monospace; font-size: 12px;
  }
</style>
</head>
<body>
  <div class="groups" id="groups"></div>
  <div id="simpanel" style="display:none">
    SIMULATOR — dev only, hidden on the real station
    <div id="simrows"></div>
  </div>

<script>
const PRESETS = ["healthy_nvme","worn_nvme","failing_nvme","healthy_ssd",
  "smart_fail_ssd","healthy_hdd","warning_hdd","failing_hdd",
  "yank_mid_wipe","wipe_rejected","verify_fail","wont_identify"];

const TYPE_LABEL = { NVME: "NVMe", SATA_SSD: "SATA SSD", SATA_HDD: "SATA HDD" };

async function post(url, body) {
  await fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : null});
}

function tileHTML(s) {
  const d = s.drive, h = s.health;
  let inner = `<div class="top"><span class="slot">${s.slot_id}</span>` +
    (d ? `<span class="type">${TYPE_LABEL[d.drive_type] ?? ""}</span>` : "") +
    `</div>`;

  if (s.status === "EMPTY") {
    return `<div class="tile EMPTY">${inner}<div class="status">EMPTY</div></div>`;
  }

  if (d) inner += `<div class="model">${d.manufacturer} ${d.model}</div>
                   <div class="cap">${d.capacity}</div>`;

  if (h && s.status === "READY") {
    const pct = h.percent === null ? "" : `HEALTH ${h.percent}% — `;
    inner += `<div class="health ${h.verdict}">${pct}${h.verdict}</div>`;
    if (h.warnings.length) inner += `<div class="warn">${h.warnings.join(" · ")}</div>`;
  }

  if (s.status === "WIPING" || s.status === "VERIFYING") {
    const pct = Math.round(s.progress * 100);
    inner += `<div class="pct">${pct}%</div>
              <div class="bar"><div style="width:${pct}%"></div></div>`;
  }

  inner += `<div class="status">${s.status}</div>`;
  if (s.message) inner += `<div class="msg">${s.message}</div>`;

  if (s.status === "READY" && s.awaiting_confirm) {
    inner += `<div class="ask">WIPE THIS DRIVE?</div>
      <div class="buttons">
        <button class="yes" onclick="post('/api/slots/${s.slot_id}/wipe')">YES</button>
        <button class="no" onclick="post('/api/slots/${s.slot_id}/decline')">NO</button>
      </div>`;
  }
  return `<div class="tile ${s.status}">${inner}</div>`;
}

let simBuilt = false;
function buildSim(slots) {
  document.getElementById("simrows").innerHTML = slots.map(s => `
    <div class="row">
      <b>${s.slot_id}</b>
      <select id="preset-${s.slot_id}">
        ${PRESETS.map(p => `<option>${p}</option>`).join("")}
      </select>
      <button onclick="post('/api/sim/insert',{slot:'${s.slot_id}',preset:document.getElementById('preset-${s.slot_id}').value})">insert</button>
      <button onclick="post('/api/sim/remove',{slot:'${s.slot_id}'})">remove / yank</button>
    </div>`).join("");
  document.getElementById("simpanel").style.display = "block";
  simBuilt = true;
}

async function refresh() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    const groups = {};
    for (const s of data.slots) (groups[s.group] ??= []).push(s);
    document.getElementById("groups").innerHTML =
      Object.entries(groups).map(([name, slots]) =>
        `<div class="group"><h2>${name}</h2>${slots.map(tileHTML).join("")}</div>`
      ).join("");
    if (data.sim_mode && !simBuilt) buildSim(data.slots);
  } catch (e) { /* server restarting; keep polling */ }
}
refresh();
setInterval(refresh, 700);
</script>
</body>
</html>
