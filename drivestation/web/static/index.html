<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Drive Station</title>
<style>
  /* Graphite console — one viewport, every slot visible. No scroll. */
  :root {
    --canvas: #34373d;
    --section: #3d4046;
    --hair-dk: #4c5057;
    --ghost: #61656d;
    --card: #f1f1ef;
    --card-line: #d9d9d5;
    --ink: #1b1d20;
    --muted: #75787f;
    --topbar: #232529;
    --ok: #178040;
    --work: #d19200;
    --alarm: #c03328;
    --active: #2f6fc4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--canvas); color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    display: flex; flex-direction: column;
    height: 100dvh;
  }
  .num { font-family: "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  #topbar {
    flex: 0 0 40px;
    background: var(--topbar); color: #eceded;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid #000;
  }
  #topbar .title { font-size: 12px; font-weight: 700; letter-spacing: 3px; }
  #topbar .right { display: flex; align-items: center; gap: 18px; }
  #topbar .nav a {
    color: #a6a9af; text-decoration: none; font-size: 10px; font-weight: 700;
    letter-spacing: 1.4px; margin-left: 12px;
  }
  #topbar .nav a:hover { color: #fff; }
  #counts { display: flex; gap: 14px; font-size: 11px; font-weight: 600; }
  #counts .c { display: flex; align-items: center; gap: 6px; color: #a6a9af; }
  #counts .n { color: #fff; font-weight: 700; }
  #counts .sq { width: 7px; height: 7px; display: inline-block; }
  .sq.READY    { background: #eceded; }
  .sq.CHECKING, .sq.DETECTED { background: var(--active); }
  .sq.WIPING, .sq.VERIFYING  { background: var(--work); }
  .sq.PASSED   { background: #1da04f; }
  .sq.FAILED, .sq.ERROR { background: #e04a3d; }
  .sq.EMPTY    { background: var(--ghost); }
  #clock { font-size: 12px; color: #a6a9af; letter-spacing: .5px; }

  #queuebar {
    display: none; flex: 0 0 auto;
    margin: 0; padding: 6px 16px;
    background: #2a3340; border-bottom: 1px solid var(--hair-dk);
    color: #cdd0d5; font-size: 11px;
  }
  #queuebar b { color: #fff; letter-spacing: 1px; }

  /* Dense one-viewport board — every occupied tile shows the same detail set. */
  #board {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 5px 8px 6px;
    overflow: hidden;
  }
  .band {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--section);
    border: 1px solid var(--hair-dk);
    padding: 5px 7px 6px;
  }
  .band h2 {
    flex: 0 0 auto;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 9px; font-weight: 700; letter-spacing: 1.6px;
    color: #cdd0d5; text-transform: uppercase;
    padding-bottom: 3px; margin-bottom: 4px;
    border-bottom: 1px solid var(--hair-dk);
  }
  .band h2 .cnt { color: #83878e; font-weight: 600; letter-spacing: .5px; }
  .band.wipe-only h2 span:first-child { color: #e8c07a; }
  .slots {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    gap: 5px;
    grid-auto-rows: 1fr;
  }
  .tile {
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tile.solid { background: var(--card); border: 1px solid #101113; }
  .tile.ghost { background: transparent; border: 1px dashed var(--ghost); color: #8d9199; }
  /* Chrome rows never shrink — only leftover white can compress. */
  .tile .tilebar,
  .tile .ask,
  .tile .foot,
  .tile .prog,
  .tile .metrics,
  .tile .method,
  .tile .idrow,
  .tile .hero,
  .tile .flagline { flex: 0 0 auto; }

  .tilebar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px; padding: 4px 8px; flex-wrap: nowrap;
  }
  .solid .tilebar { border-bottom: 1px solid var(--card-line); }
  .tilebar .id { font-size: 12px; font-weight: 800; letter-spacing: .3px; }
  .tilebar .iface {
    font-size: 9px; font-weight: 700; letter-spacing: .8px;
    color: var(--muted); border: 1px solid var(--card-line);
    padding: 1px 5px; text-transform: uppercase;
  }
  .tilebar .guard {
    font-size: 9px; font-weight: 800; letter-spacing: .3px;
    color: #141414; background: var(--work);
    padding: 2px 5px; animation: blink 1.2s step-end infinite;
  }
  .tilebar .badge {
    font-size: 9px; font-weight: 800; letter-spacing: .3px;
    color: #fff; background: #5a3d1a; padding: 2px 5px;
  }
  .tilebar .badge.queue { background: var(--active); }
  .ghost .tilebar .guard { color: #141414; }

  .data {
    flex: 1 1 auto; min-height: 0;
    padding: 5px 8px 3px;
    display: flex; flex-direction: column; gap: 4px;
    overflow: visible;
  }
  .hero {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px;
  }
  .hero .model {
    font-size: 14px; font-weight: 800; line-height: 1.15;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; flex: 1 1 auto;
  }
  .hero .health {
    flex: 0 0 auto;
    font-size: 14px; font-weight: 800; line-height: 1.1;
    white-space: nowrap; text-align: right;
  }
  .flagline {
    font-size: 10px; font-weight: 700; line-height: 1.15;
    color: var(--alarm);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .idrow {
    display: grid;
    grid-template-columns: 1.2fr 0.7fr 1.1fr;
    gap: 2px 8px;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--card-line);
  }
  /* Fixed skeleton — always same keys; missing values show em dash. */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px 8px;
  }
  .fact {
    display: flex; flex-direction: column; gap: 0;
    min-width: 0;
    padding: 1px 0 2px;
    border-bottom: 1px solid var(--card-line);
  }
  .fact .k {
    font-size: 9px; font-weight: 700; letter-spacing: .4px;
    color: var(--muted); text-transform: uppercase; line-height: 1.1;
  }
  .fact .v {
    font-size: 12px; font-weight: 700; line-height: 1.15;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; color: var(--ink);
  }
  .fact .v.mono {
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 12px; font-weight: 700;
  }
  .fact .v.na { color: #a0a3a8; font-weight: 600; }
  .method {
    font-size: 10px; font-weight: 700; letter-spacing: .25px;
    color: var(--muted); text-transform: uppercase;
    padding-top: 2px;
    border-top: 1px solid var(--card-line);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .v.h-GOOD { color: var(--ok); font-weight: 800; }
  .v.h-WARNING, .v.h-UNKNOWN { color: #96660a; font-weight: 800; }
  .v.h-SCRAP, .v.h-FAIL { color: var(--alarm); font-weight: 800; }
  a.listing {
    color: var(--active); font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 11px; font-weight: 700; text-decoration: none;
  }

  .nodevice {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 750; letter-spacing: 1.6px;
  }
  .solid .nodevice { color: var(--muted); }
  .tile.ghost .nodevice { opacity: .85; }

  .prog { padding: 2px 8px 5px; }
  .prog .lbl {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 9px; font-weight: 600; letter-spacing: .7px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 2px;
  }
  .prog .pct { font-size: 13px; font-weight: 700; color: var(--ink); }
  .prog .meta {
    display: flex; justify-content: space-between; gap: 6px;
    font-size: 9px; font-weight: 600; color: var(--ink);
    margin-bottom: 2px; font-variant-numeric: tabular-nums;
  }
  .prog .meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog .bar { height: 4px; background: #dddddad9; }
  .prog .bar > div { height: 100%; background: var(--work); transition: width .4s linear; }

  .foot { padding: 4px 8px 5px; }
  .foot .word { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
  .foot .note {
    font-size: 10px; font-weight: 550; margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ghost .foot { color: #8d9199; }
  .solid .foot { border-top: 1px solid var(--card-line); }
  .foot.READY { background: #e4e4e1; }
  .foot.DETECTED, .foot.CHECKING { background: var(--active); color: #fff; border-top: none; }
  .foot.CHECKING .word { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .foot.WIPING, .foot.VERIFYING { background: var(--work); color: #141414; border-top: none; }
  .foot.PASSED { background: var(--ok); color: #fff; border-top: none; }
  .foot.FAILED, .foot.ERROR { background: var(--alarm); color: #fff; border-top: none; }

  .ask {
    margin-top: auto;
    padding: 4px 8px 5px; border-top: 1px solid var(--card-line);
  }
  .ask .q {
    font-size: 9px; font-weight: 650; letter-spacing: .4px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .buttons { display: flex; gap: 5px; flex-wrap: nowrap; }
  button.act {
    flex: 1 1 0; min-width: 0; height: 30px;
    font-size: 11px; font-weight: 750; letter-spacing: .7px;
    cursor: pointer; font-family: inherit; border: 1px solid transparent;
    padding: 0 4px;
  }
  .yes { background: var(--ok); color: #fff; }
  .yes:active { background: #0f5e2c; }
  .yes.secondary { background: var(--active); }
  .no { background: transparent; color: var(--ink); border-color: #b9b9b4; }
  .no:active { background: #e4e4e1; }
  button.act:disabled { opacity: .55; cursor: wait; }

  #simpanel { display: none !important; }
  #simpanel h2 {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase;
    padding-bottom: 8px; margin-bottom: 8px;
    border-bottom: 1px solid var(--hair-dk);
  }
  #simrows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 16px; }
  #simpanel .srow { display: flex; gap: 6px; align-items: center; font-size: 11px; }
  #simpanel b { width: 56px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px; }
  #simpanel select, #simpanel button {
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px;
    border: 1px solid var(--hair-dk); background: #2c2e33;
    color: #cdd0d5; padding: 3px 7px; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="topbar">
    <span>
      <span class="title">DRIVE STATION</span>
      <span class="nav">
        <a href="/">BOARD</a>
        <a href="/logs">LOGS</a>
        <a href="/files/">FILES</a>
      </span>
    </span>
    <div class="right">
      <div id="counts"></div>
      <span id="clock" class="num"></span>
    </div>
  </div>
  <div id="queuebar"></div>
  <div id="board"></div>
  <div id="simpanel">
    <h2>Simulation control — dev build only</h2>
    <div id="simrows"></div>
  </div>

<script>
const PRESETS = ["healthy_nvme","worn_nvme","failing_nvme","healthy_ssd",
  "smart_fail_ssd","healthy_hdd","warning_hdd","failing_hdd",
  "yank_mid_wipe","wipe_rejected","verify_fail","wont_identify"];

const TYPE_LABEL = {
  NVME: "NVMe", SATA_SSD: "SATA SSD", SATA_HDD: "SATA HDD",
  SAS_HDD: "SAS HDD", SAS_SSD: "SAS SSD",
};
const STATUS_ORDER = ["READY","CHECKING","WIPING","VERIFYING","PASSED","FAILED","ERROR","EMPTY"];
const TB = 1e12;

/* One screen: grade + wipe bands. Names match the physical docks.
   `flex` weights vertical space — NVMe grade tiles need room for SMART rows. */
const BANDS = [
  /* One row per band so every tile gets full band height (no clipped metrics). */
  { title: "GRADE — STARTECH NVME", groups: ["NVME GRADE"], cols: 2, flex: 2.6 },
  { title: "GRADE — STARTECH SATA / M.2", groups: ["STARTECH SATA", "M.2 DOCK"], cols: 5, flex: 2.4 },
  { title: "WIPE — SUITOK", groups: ["SUITOK"], cols: 4, wipe: true, flex: 2.3 },
];

/* Grade docks always show this skeleton; missing SMART → "—". */
const GRADE_METRICS = ["Powered", "Cycles", "Written", "Read", "Temp", "Spare"];
const NVME_EXTRA = ["Unsafe"];

/* Board poll rewrites innerHTML every ~700ms. On a touchscreen that destroys
   the button between touchstart and click — first tap "does nothing". */
let refreshPausedUntil = 0;
let pointerOnBoard = false;
let lastBoardSig = "";
let actionInFlight = false;

function pauseRefresh(ms) {
  refreshPausedUntil = Math.max(refreshPausedUntil, Date.now() + ms);
}

async function post(url, body, btn) {
  if (actionInFlight) return;
  actionInFlight = true;
  pauseRefresh(4000);
  const label = btn ? btn.textContent : "";
  if (btn) {
    btn.disabled = true;
    btn.textContent = "WORKING…";
    const row = btn.closest(".buttons");
    if (row) for (const b of row.querySelectorAll("button")) b.disabled = true;
  }
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : null,
    });
    if (!res.ok) {
      let detail = res.statusText || String(res.status);
      try {
        const j = await res.json();
        if (j && j.detail) detail = typeof j.detail === "string"
          ? j.detail : JSON.stringify(j.detail);
      } catch (_) { /* keep statusText */ }
      console.error("POST failed", url, detail);
      alert(`Action failed: ${detail}`);
      if (btn) btn.textContent = label;
    } else if (btn) {
      btn.textContent = "OK";
    }
    lastBoardSig = ""; // force redraw with new state
    await refresh(true);
  } catch (e) {
    console.error("POST error", url, e);
    alert(`Action failed: ${e.message || e}`);
    if (btn) btn.textContent = label;
  } finally {
    actionInFlight = false;
    pauseRefresh(500);
  }
}

function fact(k, v, cls = "") {
  const empty = v == null || v === "" || v === "—";
  const c = empty ? "na" : cls;
  const shown = empty ? "—" : v;
  return `<div class="fact"><span class="k">${k}</span><span class="v ${c}">${shown}</span></div>`;
}

function detailMap(h) {
  const m = {};
  for (const x of (h && h.details) || []) m[x.k] = x.v;
  return m;
}

function gradeMetricsHTML(d, h) {
  const m = detailMap(h);
  const keys = [...GRADE_METRICS];
  if (d.drive_type === "NVME") {
    for (const k of NVME_EXTRA) if (!keys.includes(k)) keys.push(k);
  }
  return keys.map(k => fact(k, m[k], "mono")).join("");
}

/* Former Sabrent dual needed a sibling-busy guard (not hot-swap).
   StarTech 4-bay is hot-swap — no power-cycle lockout chip. */
function guardChip(_s, _busySlots) {
  return "";
}

function tileHTML(s, busyByGroup) {
  const d = s.drive, h = s.health;
  const guard = guardChip(s, busyByGroup[s.group] ?? []);
  const largeNvme = d && d.drive_type === "NVME" && (d.capacity_bytes || 0) >= TB;
  const mode = s.wipe_only ? "wipe" : "grade";
  const badges = [];
  if (s.wipe_only) badges.push(`<span class="badge">WIPE ONLY</span>`);
  if (s.queued_from) badges.push(`<span class="badge queue">FROM ${s.queued_from}</span>`);

  if (s.status === "EMPTY") {
    /* Band title already says WIPE — don't stamp WIPE ONLY on every empty bay. */
    return `<div class="tile ghost ${mode}">
        <div class="tilebar"><span class="id">${s.slot_id}</span>${guard}</div>
        <div class="nodevice">NO DEVICE</div>
        <div class="foot"><span class="word">EMPTY</span></div>
      </div>`;
  }

  let body = "";
  if (d) {
    const pct = h && h.percent !== null && h.percent !== undefined
      ? `${h.percent}% ` : "";
    const healthCls = h ? `health h-${h.verdict}` : "health";
    const healthTxt = h ? `${pct}${h.verdict}` : "—";
    let flagline = "";
    if (h) {
      const busy = s.status === "WIPING" || s.status === "VERIFYING";
      if (h.warnings.length && !busy) {
        const warn = h.warnings[0];
        flagline = `<div class="flagline" title="${h.warnings.join(" · ")}">${warn}</div>`;
      }
    }
    const method = s.wipe_method
      ? `<div class="method">${s.status === "READY" ? "Plan" : "Method"} · ${s.wipe_method.replaceAll("_", " ")}</div>`
      : "";

    const idBits = [
      fact("Serial", d.serial, "mono"),
      fact("Size", d.capacity, "mono"),
      fact("Data", (s.usage && s.usage.label) ? s.usage.label : "—"),
    ].join("");
    let extra = "";
    if (s.status === "PASSED") {
      extra = fact("Result", "WIPED · VERIFIED EMPTY", "h-GOOD")
        + fact("Card",
          `<a class="listing" href="/d/${encodeURIComponent(d.serial)}">/d/${d.serial}</a>`);
    }
    /* Same detail set on grade and wipe docks — missing SMART → "—". */
    body = `<div class="data">
      <div class="hero">
        <div class="model">${d.manufacturer} ${d.model}</div>
        <div class="${healthCls}">${healthTxt}</div>
      </div>
      ${flagline}
      <div class="idrow">${idBits}</div>
      <div class="metrics">${gradeMetricsHTML(d, h)}${extra}</div>
      ${method}
    </div>`;
  } else if (s.status === "DETECTED" || s.status === "CHECKING") {
    body = `<div class="nodevice">IDENTIFYING</div>`;
  } else {
    body = `<div class="nodevice">NO DEVICE DATA</div>`;
  }

  if (s.status === "WIPING" || s.status === "VERIFYING") {
    const pct = Math.round(s.progress * 100);
    const elapsed = fmtDuration(s.wipe_elapsed_s);
    const eta = (s.wipe_eta_s == null) ? "—" : fmtDuration(s.wipe_eta_s);
    const rate = fmtRate(s.wipe_bps);
    body += `<div class="prog">
        <div class="lbl"><span>${s.status === "WIPING" ? "Wipe" : "Verify"}</span>
        <span class="pct num">${pct}%</span></div>
        <div class="meta num"><span>${elapsed} elapsed</span><span>${rate}</span><span>ETA ${eta}</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </div>`;
  }

  let ask = "";
  if (s.status === "READY" && s.awaiting_confirm) {
    const prior = s.prior_wipe || null;
    const alreadyClean = prior && prior.still_clean;
    let dataQ;
    if (alreadyClean) {
      const when = (prior.finished_at || "").slice(0, 10) || "earlier";
      dataQ = `Already wiped PASSED ${when} — still empty. Done, or rewipe?`;
    } else if (prior && prior.had_passed) {
      dataQ = "Previously wiped but data present — rewipe?";
    } else if (s.queued_from && s.wipe_only) {
      dataQ = `Queued from ${s.queued_from} — wipe now?`;
    } else if (largeNvme && !s.wipe_only) {
      dataQ = "≥1TB NVMe — send to WIPE ONLY dock?";
    } else if (s.usage && s.usage.label) {
      dataQ = `Wipe this drive? (${s.usage.label})`;
    } else {
      dataQ = "Secure wipe this drive?";
    }
    const buttons = [];
    if (alreadyClean) {
      buttons.push(`<button type="button" class="act yes" data-action="decline" data-slot="${s.slot_id}">DONE</button>`);
      buttons.push(`<button type="button" class="act yes secondary" data-action="wipe" data-slot="${s.slot_id}">REWIPE</button>`);
    } else if (s.wipe_only) {
      buttons.push(`<button type="button" class="act yes" data-action="wipe" data-slot="${s.slot_id}">WIPE</button>`);
      buttons.push(`<button type="button" class="act no" data-action="decline" data-slot="${s.slot_id}">SKIP</button>`);
    } else if (largeNvme) {
      buttons.push(`<button type="button" class="act yes" data-action="wipe" data-slot="${s.slot_id}">QUEUE</button>`);
      buttons.push(`<button type="button" class="act yes secondary" data-action="wipe-here" data-slot="${s.slot_id}">WIPE HERE</button>`);
      buttons.push(`<button type="button" class="act no" data-action="decline" data-slot="${s.slot_id}">SKIP</button>`);
    } else {
      buttons.push(`<button type="button" class="act yes" data-action="wipe" data-slot="${s.slot_id}">WIPE</button>`);
      if (d && d.drive_type === "NVME") {
        buttons.push(`<button type="button" class="act yes secondary" data-action="queue" data-slot="${s.slot_id}">TO WIPE DOCK</button>`);
      }
      buttons.push(`<button type="button" class="act no" data-action="decline" data-slot="${s.slot_id}">SKIP</button>`);
    }
    ask = `<div class="ask"><div class="q">${dataQ}</div>
      <div class="buttons">${buttons.join("")}</div></div>`;
  }

  let foot = "";
  if (!ask) {
    const word = s.status === "PASSED" ? "WIPED" : s.status;
    foot = `<div class="foot ${s.status}"><span class="word">${word}</span>` +
      (s.message ? `<div class="note">${s.message}</div>` : "") + `</div>`;
  }

  const right = [
    ...badges,
    guard,
    (!s.wipe_only && d
      ? `<span class="iface">${TYPE_LABEL[d.drive_type] ?? ""}</span>` : ""),
  ].filter(Boolean).join("");
  return `<div class="tile solid ${mode}">
      <div class="tilebar"><span class="id">${s.slot_id}</span>${right}</div>
      ${body}${ask}${foot}
    </div>`;
}

let simBuilt = false;
function buildSim(slots) {
  document.getElementById("simrows").innerHTML = slots.map(s => `
    <div class="srow">
      <b>${s.slot_id}</b>
      <select id="preset-${s.slot_id}">
        ${PRESETS.map(p => `<option>${p}</option>`).join("")}
      </select>
      <button type="button" data-sim="insert" data-slot="${s.slot_id}">insert</button>
      <button type="button" data-sim="remove" data-slot="${s.slot_id}">yank</button>
    </div>`).join("");
  document.getElementById("simpanel").style.display = "block";
  simBuilt = true;
}

function renderCounts(slots) {
  const c = {};
  for (const s of slots) c[s.status] = (c[s.status] ?? 0) + 1;
  document.getElementById("counts").innerHTML = STATUS_ORDER
    .filter(st => c[st])
    .map(st => `<span class="c"><span class="sq ${st}"></span>${st} <span class="n num">${c[st]}</span></span>`)
    .join("");
}

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
}
setInterval(tick, 1000); tick();

function fmtDuration(sec) {
  if (sec == null || !isFinite(sec)) return "—";
  const s = Math.max(0, Math.round(sec));
  const m = Math.floor(s / 60);
  const r = s % 60;
  if (m >= 60) {
    const h = Math.floor(m / 60);
    return `${h}h ${m % 60}m`;
  }
  return m > 0 ? `${m}m ${String(r).padStart(2, "0")}s` : `${r}s`;
}
function fmtRate(bps) {
  if (bps == null || !isFinite(bps) || bps <= 0) return "—";
  const gb = bps / 1e9;
  if (gb >= 1) return `${gb.toFixed(2)} GB/s`;
  const mb = bps / 1e6;
  if (mb >= 1) return `${mb.toFixed(0)} MB/s`;
  return `${(bps / 1e3).toFixed(0)} KB/s`;
}

function boardSignature(data) {
  const q = (data.pending_wipes || [])
    .map(p => `${p.serial}@${p.from_slot}`).join(",");
  const slots = (data.slots || []).map(s => {
    const d = s.drive || {};
    const h = s.health || {};
    const pw = s.prior_wipe || {};
    return [
      s.slot_id, s.status, s.awaiting_confirm ? 1 : 0,
      Math.round((s.progress || 0) * 100), s.message || "",
      d.serial || "", h.verdict || "", h.percent ?? "",
      s.queued_from || "", s.wipe_method || "",
      Math.floor(s.wipe_elapsed_s || 0),
      Math.floor(s.wipe_bps || 0),
      pw.result || "", pw.still_clean ? 1 : 0,
    ].join("|");
  }).join(";");
  return q + "::" + slots;
}

async function refresh(force = false) {
  if (!force) {
    if (pointerOnBoard) return;
    if (actionInFlight) return;
    if (Date.now() < refreshPausedUntil) return;
  }
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    const sig = boardSignature(data);
    if (!force && sig === lastBoardSig) return;
    // Don't nuke the DOM while a finger is still down on a button.
    if (!force && pointerOnBoard) return;
    lastBoardSig = sig;

    const all = data.slots;
    const byGroup = {};
    const busyByGroup = {};
    for (const s of all) {
      (byGroup[s.group] ??= []).push(s);
      if (s.status === "WIPING" || s.status === "VERIFYING") {
        (busyByGroup[s.group] ??= []).push(s.slot_id);
      }
    }

    document.getElementById("board").innerHTML = BANDS.map(band => {
      const slots = band.groups.flatMap(g => byGroup[g] || []);
      if (!slots.length) return "";
      const wipeCls = band.wipe ? " wipe-only" : "";
      const weight = band.flex ?? slots.length;
      const flex = `flex:${weight} 1 0`;
      return `<div class="band${wipeCls}" style="${flex}">
        <h2><span>${band.title}</span><span class="cnt">${slots.length} SLOTS</span></h2>
        <div class="slots" style="grid-template-columns: repeat(${band.cols}, minmax(0, 1fr))">
          ${slots.map(s => tileHTML(s, busyByGroup)).join("")}
        </div>
      </div>`;
    }).join("");

    renderCounts(all);
    const q = data.pending_wipes || [];
    const qb = document.getElementById("queuebar");
    if (q.length) {
      qb.style.display = "block";
      qb.innerHTML = `<b>QUEUED FOR WIPE DOCK</b> — ` +
        q.map(p => `${p.serial} <span style="color:#83878e">(from ${p.from_slot})</span>`).join(" · ");
    } else {
      qb.style.display = "none";
      qb.innerHTML = "";
    }
    /* Sim insert/yank panel disabled — it steals height and breaks the board. */
  } catch (e) { /* server restarting; keep polling */ }
}

const boardEl = document.getElementById("board");
boardEl.addEventListener("pointerdown", () => {
  pointerOnBoard = true;
  pauseRefresh(2000);
}, true);
window.addEventListener("pointerup", () => { pointerOnBoard = false; });
window.addEventListener("pointercancel", () => { pointerOnBoard = false; });
window.addEventListener("blur", () => { pointerOnBoard = false; });

boardEl.addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-action]");
  if (!btn || btn.disabled) return;
  const slot = btn.dataset.slot;
  const action = btn.dataset.action;
  const url = `/api/slots/${encodeURIComponent(slot)}/${action}`;
  post(url, null, btn);
});

document.getElementById("simpanel").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-sim]");
  if (!btn) return;
  const slot = btn.dataset.slot;
  if (btn.dataset.sim === "insert") {
    const preset = document.getElementById(`preset-${slot}`).value;
    post("/api/sim/insert", {slot, preset}, btn);
  } else {
    post("/api/sim/remove", {slot}, btn);
  }
});

refresh(true);
setInterval(() => refresh(false), 700);
</script>
</body>
</html>
